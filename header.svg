<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#030504"/>
      <stop offset="0.5" stop-color="#07110D"/>
      <stop offset="1" stop-color="#020303"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0">
      <stop stop-color="#00FF9D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00FF9D"/>
      <stop offset="1" stop-color="#00FF9D" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0" stop-color="#00FF9D" stop-opacity=".28"/>
      <stop offset="1" stop-color="#00FF9D" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#0D2A20" stroke-width="1"/>
    </pattern>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clip">
      <rect width="1200" height="360" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)" opacity=".55"/>

    <circle cx="600" cy="180" r="290" fill="url(#glow)">
      <animate attributeName="r" values="250;310;250" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".55;.95;.55" dur="7s" repeatCount="indefinite"/>
    </circle>

    <g opacity=".85">
      <path d="M100 72H290" stroke="#00FF9D" stroke-opacity=".28"/>
      <path d="M910 288H1100" stroke="#00FF9D" stroke-opacity=".28"/>
      <circle cx="96" cy="72" r="3" fill="#00FF9D"/>
      <circle cx="1104" cy="288" r="3" fill="#00FF9D"/>
    </g>

    <g opacity=".30">
      <path d="M0 120H1200" stroke="url(#line)">
        <animateTransform attributeName="transform" type="translate" values="0 -90;0 360" dur="5.5s" repeatCount="indefinite"/>
      </path>
    </g>

    <g font-family="monospace" font-size="13" fill="#6AF5B8" opacity=".52">
      <text x="56" y="54">SYSTEM::PROFILE_INIT</text>
      <text x="958" y="54">STATUS::ONLINE</text>
      <text x="56" y="322">BUILD::DN_DEV</text>
      <text x="948" y="322">MODE::CREATIVE</text>
    </g>

    <g opacity=".75">
      <rect x="426" y="126" width="348" height="108" rx="18" stroke="#00FF9D" stroke-opacity=".12"/>
      <rect x="438" y="138" width="324" height="84" rx="14" stroke="#00FF9D" stroke-opacity=".08"/>
    </g>

    <text x="600" y="184"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-weight="800"
          font-size="74"
          letter-spacing="7"
          fill="#F7FFFB"
          filter="url(#textGlow)">
      DN DEV
      <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;.12;.92;1" dur="3.2s" repeatCount="indefinite"/>
    </text>

    <text x="600" y="220"
          text-anchor="middle"
          font-family="monospace"
          font-size="16"
          letter-spacing="4"
          fill="#00FF9D">
      BUILD • BREAK • IMPROVE • REPEAT
      <animate attributeName="opacity" values=".35;1;.35" dur="2.8s" repeatCount="indefinite"/>
    </text>

    <g filter="url(#softGlow)">
      <rect x="-260" y="0" width="180" height="360" fill="#00FF9D" opacity=".06" transform="skewX(-18)">
        <animate attributeName="x" values="-260;1480" dur="5.8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g opacity=".72">
      <circle cx="170" cy="180" r="2.2" fill="#00FF9D">
        <animate attributeName="cy" values="180;130;180" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1030" cy="154" r="2" fill="#00FF9D">
        <animate attributeName="cy" values="154;205;154" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="250" cy="260" r="1.8" fill="#00FF9D">
        <animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="948" cy="92" r="1.8" fill="#00FF9D">
        <animate attributeName="opacity" values="1;.2;1" dur="2.7s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="358.5" rx="27.25" stroke="#00FF9D" stroke-opacity=".16" stroke-width="1.5"/>
</svg>
